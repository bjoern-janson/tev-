name: Fix v0.1 README

on:
  push:
    branches:
      - agent/measurement-v01-readme-fix

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/measurement-v01-readme-fix
          fetch-depth: 0
      - name: Correct v0.1 README
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text()
          old = "When a reference comparison is active, **Show Upstream** walks backward through those existing representations without changing the measurement specification: metric output → signed difference → inputs. The measurement readout keeps the candidate, reference, correspondence, channels, region, selected metric, fixed relative epsilon (`0.01`), and presentation state inspectable in one place."
          new = "When a reference comparison is active, **Show Upstream** walks backward through those existing representations without changing the measurement specification: metric output → signed difference → inputs. **Resume** traverses the same retained live lineage downstream again: inputs → signed difference → metric output. This is return traversal, not reconstruction from a stored recipe. The measurement readout keeps the candidate, reference, correspondence, channels, region, selected metric, fixed relative epsilon (`0.01`), and presentation state inspectable in one place."
          if old not in s:
              raise SystemExit('README traversal anchor not found')
          s = s.replace(old, new, 1)
          s = s.replace('https://github.com/bjoern-janson/tev-/actions/workflows/main.yml/badge.svg', 'https://github.com/bjoern-janson/tevpp/actions/workflows/main.yml/badge.svg', 1)
          p.write_text(s)
          PY
          git rm .github/workflows/fix-v01-readme.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "correct v0.1 README traversal"
          git push origin HEAD:agent/measurement-v01-readme-fix
