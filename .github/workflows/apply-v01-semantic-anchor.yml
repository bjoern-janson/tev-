name: Apply v0.1 semantic anchor

on:
  push:
    branches:
      - agent/measurement-v01-anchor

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/measurement-v01-anchor
          fetch-depth: 0
      - name: Apply semantic anchor
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          def d(value):
              return base64.b64decode(value).decode()
          replacements = {
              'sampling_old': '',
              'sampling_new': '',
              'lineage_old': 'c3RydWN0IE1lYXN1cmVtZW50TGluZWFnZSB7CiAgICBNZWFzdXJlbWVudFNwZWMgbWVhc3VyZW1lbnQ7CiAgICBNZWFzdXJlbWVudFN0YWdlIHN0YWdlID0gTWVhc3VyZW1lbnRTdGFnZTo6SW5wdXRzOwogICAgVmlld1NwZWMgdmlldzsKfTsK',
              'lineage_new': '',
              'show_old': '',
              'show_new': '',
              'sampling_canvas_old': '',
              'sampling_canvas_new': 'ICAgICAgICAgICAgaWYgKG1JbWFnZSkgewogICAgICAgICAgICAgICAgbGluZWFnZS5tZWFzdXJlbWVudC5zYW1wbGluZyA9IG1lYXN1cmVtZW50U2FtcGxpbmdTcGVjKG1JbWFnZS0+ZGF0YVdpbmRvdygpLCBtTWVhc3VyZW1lbnRSZWZlcmVuY2UtPmRhdGFXaW5kb3coKSk7CiAgICAgICAgICAgIH0K',
              'sync_old': '',
              'sync_new': '',
              'test_src': '',
              'cmake_anchor': 'dGFyZ2V0X2xpbmtfbGlicmFyaWVzKHRldiBQUklWQVRFICR7VEVWX0xJQlN9KQo=',
              'cmake_add': ''
          }
          p = Path('include/tev/Measurement.h')
          s = p.read_text()
          for old_key, new_key in [('sampling_old','sampling_new'), ('lineage_old','lineage_new')]:
              old, new = d(replacements[old_key]), d(replacements[new_key])
              if old not in s:
                  raise SystemExit(f'{old_key} anchor not found')
              s = s.replace(old, new, 1)
          p.write_text(s)
          p = Path('include/tev/ImageCanvas.h')
          s = p.read_text()
          for old_key, new_key in [('show_old','show_new'), ('sampling_canvas_old','sampling_canvas_new'), ('sync_old','sync_new')]:
              old, new = d(replacements[old_key]), d(replacements[new_key])
              if old not in s:
                  raise SystemExit(f'{old_key} anchor not found')
              s = s.replace(old, new, 1)
          p.write_text(s)
          Path('tests').mkdir(exist_ok=True)
          Path('tests/MeasurementSemanticsTest.cpp').write_text(d(replacements['test_src']))
          p = Path('CMakeLists.txt')
          s = p.read_text()
          old, new = d(replacements['cmake_anchor']), d(replacements['cmake_add'])
          if old not in s:
              raise SystemExit('CMake anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git rm .github/workflows/apply-v01-semantic-anchor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt include/tev/Measurement.h include/tev/ImageCanvas.h tests/MeasurementSemanticsTest.cpp
          git commit -m "add v0.1 measurement semantic anchor"
          git push origin HEAD:agent/measurement-v01-anchor
