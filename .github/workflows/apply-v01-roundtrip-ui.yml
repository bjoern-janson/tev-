name: Apply v0.1 round-trip UI

on:
  push:
    branches:
      - agent/measurement-v01-anchor

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/measurement-v01-anchor
          fetch-depth: 0
      - name: Apply round-trip UI
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          decode = lambda value: base64.b64decode(value).decode()
          replacements = {
            'include/tev/ImageCanvas.h': [
              ('', '')
            ],
            'include/tev/Measurement.h': [
              ('', '')
            ],
            'include/tev/ImageViewer.h': [
              ('ICAgIG5hbm9ndWk6OkxhYmVsKiBtTWVhc3VyZW1lbnRTdGFnZUxhYmVsID0gbnVsbHB0cjsKICAgIG5hbm9ndWk6OkJ1dHRvbiogbVNob3dVcHN0cmVhbUJ1dHRvbiA9IG51bGxwdHI7Cg==', 'ICAgIG5hbm9ndWk6OkxhYmVsKiBtTWVhc3VyZW1lbnRTdGFnZUxhYmVsID0gbnVsbHB0cjsKICAgIG5hbm9ndWk6OkJ1dHRvbiogbVNob3dVcHN0cmVhbUJ1dHRvbiA9IG51bGxwdHI7CiAgICBuYW5vZ3VpOjpCdXR0b24qIG1SZXN1bWVEb3duc3RyZWFtQnV0dG9uID0gbnVsbHB0cjsK')
            ],
            'src/ImageViewer.cpp': [
              ('', ''),
              ('', '')
            ]
          }
          for path, pairs in replacements.items():
              p = Path(path)
              s = p.read_text()
              for old64, new64 in pairs:
                  old, new = decode(old64), decode(new64)
                  if old not in s:
                      raise SystemExit(f'round-trip UI anchor not found in {path}')
                  s = s.replace(old, new, 1)
              p.write_text(s)
          PY
          git rm .github/workflows/apply-v01-roundtrip-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add include/tev/ImageCanvas.h include/tev/Measurement.h include/tev/ImageViewer.h src/ImageViewer.cpp
          git commit -m "make measurement stage traversal bidirectional"
          git push origin HEAD:agent/measurement-v01-anchor
