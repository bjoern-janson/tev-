name: Apply GCC formatting portability fix

on:
  push:
    branches:
      - agent/measurement-v01-anchor

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/measurement-v01-anchor
          fetch-depth: 0
      - name: Apply demonstrated portability fix
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          decode = lambda value: base64.b64decode(value).decode()
          old_helper = decode('')
          new_helper = decode('')
          old_arg = decode('ICAgICAgICBsaW5lYWdlLm1lYXN1cmVtZW50LnJlZ2lvbiwK')
          new_arg = decode('ICAgICAgICBtZWFzdXJlbWVudFJlZ2lvbkZvcm11bGEobGluZWFnZS5tZWFzdXJlbWVudC5yZWdpb24pLAo=')
          p = Path('include/tev/Measurement.h')
          s = p.read_text()
          if old_helper not in s or old_arg not in s:
              raise SystemExit('formatting portability anchors not found')
          s = s.replace(old_helper, new_helper, 1).replace(old_arg, new_arg, 1)
          p.write_text(s)
          PY
          git rm .github/workflows/apply-gcc-format-portability-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add include/tev/Measurement.h
          git commit -m "fix GCC measurement region formatting"
          git push origin HEAD:agent/measurement-v01-anchor
