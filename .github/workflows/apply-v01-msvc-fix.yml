name: Apply v0.1 MSVC fix

on:
  push:
    branches:
      - agent/measurement-v01-msvc-fix

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/measurement-v01-msvc-fix
          fetch-depth: 0
      - name: Apply MSVC test-target fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('CMakeLists.txt')
          s = p.read_text()
          old = 'target_link_libraries(tev_measurement_semantics_test PRIVATE nanogui)\nadd_test(NAME tev_measurement_semantics COMMAND tev_measurement_semantics_test)\n'
          new = 'target_link_libraries(tev_measurement_semantics_test PRIVATE nanogui)\nif (MSVC)\n    # Measurement.h includes fmt, whose Unicode path requires UTF-8 source/execution\n    # character sets on MSVC. Match the main tev target\'s existing portability rule.\n    target_compile_options(tev_measurement_semantics_test PRIVATE /utf-8)\nendif()\nadd_test(NAME tev_measurement_semantics COMMAND tev_measurement_semantics_test)\n'
          if old not in s:
              raise SystemExit('semantic test link anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git rm .github/workflows/apply-v01-msvc-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt
          git commit -m "fix MSVC semantic test encoding"
          git push origin HEAD:agent/measurement-v01-msvc-fix
