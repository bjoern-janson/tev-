name: Validate v0.1 GCC ARM

on:
  push:
    branches:
      - agent/measurement-v01-gcc-validate

permissions:
  contents: read

env:
  SUPPORT_HEIC: false

jobs:
  validate:
    runs-on: ubuntu-24.04-arm
    env:
      build_dir: build
      config: Release
      CC: gcc
      CXX: g++
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            libc++-dev \
            libc++abi-dev \
            libdbus-1-dev \
            libffi-dev \
            libglu1-mesa-dev \
            libwayland-dev \
            libxkbcommon-dev \
            nasm \
            ninja-build \
            wayland-protocols \
            xorg-dev
      - uses: actions/checkout@v1
        with:
          submodules: recursive
      - name: CMake
        run: cmake . -B ${{ env.build_dir }} -GNinja -DCMAKE_BUILD_TYPE=${{ env.config }} -DTEV_DEPLOY=1 -DTEV_SUPPORT_HEIC=${{ env.SUPPORT_HEIC }}
      - name: Build and run semantic anchor
        run: cmake --build ${{ env.build_dir }} --target all --verbose -j
