name: Diagnose v0.1 MSVC

on:
  push:
    branches:
      - agent/measurement-v01-msvc-diagnostic

permissions:
  contents: read

env:
  SUPPORT_HEIC: true

jobs:
  diagnose:
    runs-on: windows-2022
    env:
      build_dir: build
      config: Release
    steps:
      - uses: actions/checkout@v1
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          choco install nasm
          echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          choco install wixtoolset --no-progress -y
          echo "WIX=$(Get-ChildItem 'C:\Program Files (x86)\WiX Toolset*' | Select-Object -First 1 | % FullName)" >> $env:GITHUB_ENV
      - name: CMake
        run: cmake . -B ${{ env.build_dir }} -DCMAKE_BUILD_TYPE=${{ env.config }} -DTEV_DEPLOY=1 -DTEV_SUPPORT_HEIC=${{ env.SUPPORT_HEIC }}
      - name: Build with captured output
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cmake --build $env:build_dir --config $env:config --target ALL_BUILD --verbose *>&1 | Tee-Object -FilePath measurement-msvc-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: measurement-msvc-build-log
          path: measurement-msvc-build.log
